initial_role = "build"
default_permission = "allow"
visible_to_agent = true
never_send = []

[models.haiku]
id = "claude-haiku-5-5"
context_window = 1000000
max_output_tokens = 128000
price_input = 0.10
price_output = 0.50
price_cache_write = 0.125
price_cache_write_1h = 0.20
price_cache_read = 0.01
long_prompt_threshold = 100000
long_prompt_factor = 5.0

[models.sonnet]
id = "claude-sonnet-5-5"
context_window = 1000000
max_output_tokens = 128000
price_input = 2.0
price_output = 10.0
price_cache_write = 2.5
price_cache_write_1h = 4.0
price_cache_read = 0.10
fallback = "opus"

[models.opus]
id = "claude-opus-5-5"
context_window = 1000000
max_output_tokens = 128000
price_input = 4.0
price_output = 20.0
price_cache_write = 5.0
price_cache_write_1h = 8.0
price_cache_read = 0.20

[models.fable]
id = "claude-fable-5-2"
context_window = 1000000
max_output_tokens = 128000
price_input = 8.0
price_output = 40.0
price_cache_write = 10.0
price_cache_write_1h = 16.0
price_cache_read = 0.20
fallback = "opus"

[role.explore]
model = "haiku"
effort = "low"
tools = ["sh"]
instructions = "Answer in `done` with facts only, one per line, each with its `path:line`. No preamble and no account of how you searched."

[role.mechanic]
model = "haiku"
effort = "low"
tools = ["sh", "edit"]
on_failure = { escalate_to = "build", attempts = 2 }
instructions = "Answer in `done` with one line per file changed and one line on how you checked it. Nothing else."

[role.build]
model = "opus"
effort = "high"
tools = ["sh", "edit", "spawn"]
can_spawn = ["explore", "mechanic"]

[budget]
warn_at = 0.8

[agents]
concurrent = 4
depth = 2
repeat_limit = 3

[human]
wait_seconds = 0
permission_fallback = "deny"
question_fallback = "assume"

[context]
cache_ttl = "5m"
output_cap = 12000
output_head = 4000
output_tail = 4000
clean_after_seconds = 300
clean_keep_recent = 6
clean_min_chars = 600
compact_at = 0.85
compact_keep_turns = 2
compact_keep_chars = 24000
compact_boundary_tokens = 80000

[journal]
dir = "~/.synthic/runs"

[memory]
enabled = true
dir = "~/.synthic/memory"
max_chars = 8000

[environment]
mode = "in_place"
shell = []
tool_timeout_seconds = 120

[provider]
retry_seconds = 3600
timeout_seconds = 600

[instructions]
files = []
repo_files = ["AGENTS.md", "CLAUDE.md"]
load_repo_files = false

[plugins]
skills = []
path = []
packages = []

[permissions]
