[project]
name = "synthic"
dynamic = ["version"]
license = "Apache-2.0"
readme = "README.md"
description = "An agent harness: the engine and nothing else"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
synthic = "synthic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "synthic.__version__" }

[tool.setuptools]
packages = ["synthic", "synthic.tools"]

[tool.setuptools.package-data]
synthic = ["defaults.toml", "compaction.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
